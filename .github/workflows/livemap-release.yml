name: LiveMap APK release

on:
  push:
    branches: [main, claude/livemap-widget-android-keuqcf]
    paths:
      - "livemap-widget/**"
      - ".github/workflows/livemap-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livemap-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livemap-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "LiveMap-v${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LiveMap-v${{ steps.apk.outputs.version }}
          path: livemap-widget/LiveMap-v${{ steps.apk.outputs.version }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: livemap-v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LiveMap Widget v${{ steps.apk.outputs.version }}
          make_latest: true
          files: livemap-widget/LiveMap-v${{ steps.apk.outputs.version }}.apk
          body: |
            Live home-screen map widget for Android 12+ (built and tuned for Samsung One UI).

            **Install:** download `LiveMap-v${{ steps.apk.outputs.version }}.apk` on your phone, open it, and allow
            "Install unknown apps" for your browser or file manager when asked.

            Then open LiveMap → **Start tracking**, and add the widget: long-press the home screen → Widgets → LiveMap.

            Full docs, limits and battery notes: [livemap-widget/README.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/livemap-widget/README.md)
